<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WebGPU Sand Automata</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <canvas id="gpuCanvas"></canvas>
    <div id="ui">
        <h1>Sand Game (WebGPU)</h1>
        <p>Parallel Cellular Automata with Atomic Conservation</p>
        <p class="small">Touch/Click to add sand. 1280x720 Grid.</p>

        <div id="controls">
            <div class="control-row">
                <label for="brushRange">Brush</label>
                <input id="brushRange" type="range" min="1" max="25" value="5">
            </div>
            <div class="control-row">
                <label for="gravityRange">Gravity</label>
                <input id="gravityRange" type="range" min="1" max="8" value="2">
            </div>
        </div>

        <div id="stats">FPS: <span id="fps">0</span> | Particles: <span id="particleCount">0</span></div>
    </div>
    <script type="module" src="main.js"></script>
    <script>
        // Prevent default touch actions to ensure smooth drawing
        document.addEventListener('touchmove', function(e) { e.preventDefault(); }, { passive: false });
    </script>

</body>
</html>
